site_name: AirCarto Wiki
site_url: https://wiki.aircarto.fr
site_description: Wiki AirCarto - Documentation et ressources

theme:
  name: material
  language: fr
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  palette:
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - scheme: slate
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Mode clair
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/custom.css?v=9

extra_javascript:
  - assets/javascripts/viewer-3d.js?v=12

plugins:
  - search:
      lang: fr
  # Wiki bilingue : page.md = français (défaut, URL inchangées),
  # page.en.md = anglais (servie sous /en/). Une page sans traduction
  # s'affiche en français dans la version anglaise (fallback).
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_description: AirCarto Wiki - Documentation and resources
          nav_translations:
            Accueil: Home
            Logiciels: Software
            Modèles 3D: 3D models

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - ModuleAir:
    - WiFi: moduleair-wifi/index.md
    - Pro: moduleair-pro/index.md
    - Mini: moduleair-mini/index.md
  - NebuleAir:
    - WiFi: nebuleair-wifi/index.md
    - Pro: nebuleair-pro/index.md
    - Pro Bruit: nebuleair-pro/bruit.md
  - Edu Kit: edukit/index.md
  - MobileAir: mobileair/index.md
  - ModuleTraffic: moduletraffic/index.md
  - Modèles 3D: modeles-3d/index.md
  - Logiciels:
    - OpenAirMap: openairmap/index.md
    - Cyan Sensor: cyan-sensor/index.md
